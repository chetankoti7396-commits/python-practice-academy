<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E2E Test Suite</title>
</head>
<body>
  <iframe id="app-frame" src="index.html" style="width: 1200px; height: 900px;"></iframe>
  <div id="results">Running tests...</div>

  <script>
    const errors = [];
    window.addEventListener("error", (e) => {
      errors.push(e.message);
    });

    const frame = document.getElementById("app-frame");
    frame.onload = async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const log = [];

      function assert(condition, message) {
        if (!condition) {
          throw new Error("Assertion Failed: " + message);
        }
        log.push("PASS: " + message);
      }

      try {
        // 1. Verify question count
        assert(win.QUESTIONS && win.QUESTIONS.length === 72, "Total questions is exactly 72");
        assert(win.store.getMaxQuestionId() === 72, "Storage getMaxQuestionId is 72");

        // 2. Verify all levels
        const l1 = win.QUESTIONS.filter(q => q.level === 1);
        const l7 = win.QUESTIONS.filter(q => q.level === 7);
        assert(l1.length === 10, "Level 1 has 10 questions");
        assert(l7.length === 12, "Level 7 has 12 questions (Q61-Q72)");
        assert(win.QUESTIONS[70].id === 71, "Question 71 exists");
        assert(win.QUESTIONS[71].id === 72, "Question 72 exists");

        // 3. Test Skip Link
        const skipLink = doc.querySelector(".skip-link");
        assert(skipLink, "Skip link exists in DOM");
        skipLink.click();
        const appEl = doc.getElementById("app");
        assert(doc.activeElement === appEl, "Skip link moves focus to #app");

        // 4. Test Mobile Menu Toggle & ARIA
        const mobileToggle = doc.getElementById("mobile-toggle-btn");
        const drawer = doc.getElementById("mobile-drawer");
        assert(mobileToggle && drawer, "Mobile toggle and drawer exist");
        assert(mobileToggle.getAttribute("aria-expanded") === "false", "Initial aria-expanded is false");
        assert(drawer.getAttribute("aria-hidden") === "true", "Initial drawer aria-hidden is true");

        mobileToggle.click();
        assert(mobileToggle.getAttribute("aria-expanded") === "true", "Clicked toggle sets aria-expanded to true");
        assert(drawer.getAttribute("aria-hidden") === "false", "Clicked toggle sets drawer aria-hidden to false");

        // Close via Escape key
        const escEvent = new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true });
        doc.dispatchEvent(escEvent);
        assert(mobileToggle.getAttribute("aria-expanded") === "false", "Escape closes mobile drawer");

        // 5. Test Modal Accessibility & Focus Management
        const testBtn = doc.querySelector("footer button.footer-link");
        testBtn.focus();
        win.openModal("Test Accessibility Modal", "<p>Testing aria and focus trap</p>", "OK", null);
        const backdrop = doc.getElementById("app-modal-backdrop");
        assert(backdrop.classList.contains("open"), "Modal is open");
        assert(backdrop.getAttribute("aria-hidden") === "false", "Modal aria-hidden is false");
        assert(backdrop.getAttribute("aria-labelledby") === "modal-title", "Modal backdrop has aria-labelledby");

        const closeBtn = doc.getElementById("modal-cancel-btn");
        assert(doc.activeElement === closeBtn || doc.activeElement.tagName === "BUTTON", "Focus moved inside modal");

        // Test Escape closes modal and restores focus
        doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        assert(!backdrop.classList.contains("open"), "Modal closed via Escape");
        assert(backdrop.getAttribute("aria-hidden") === "true", "Modal aria-hidden is true");
        assert(doc.activeElement === testBtn, "Focus restored to triggering button");

        // 6. Test Screen Reader Live Regions
        const srAnnounce = doc.getElementById("sr-announcements");
        const srAlert = doc.getElementById("sr-alerts");
        assert(srAnnounce && srAlert, "Screen reader live regions exist");
        assert(srAnnounce.getAttribute("aria-live") === "polite", "sr-announcements is aria-live polite");
        assert(srAlert.getAttribute("role") === "alert", "sr-alerts has role alert");

        win.announceToScreenReader("Test screen reader polite");
        await new Promise(r => setTimeout(r, 100));
        assert(srAnnounce.textContent === "Test screen reader polite", "Screen reader received announcement");

        // 7. Test Routing & Navigation across all views
        const views = ["home", "question-bank", "learn", "progress", "results", "mistakes", "practice-modes", "projects", "demos", "glossary"];
        for (const v of views) {
          win.navigateTo(v, null, false);
          assert(appEl.innerHTML.length > 50, "View " + v + " rendered HTML");
        }

        // 8. Test Question Workspace (Question 1)
        win.navigateTo("test", 1, false);
        assert(win.testEngine.currentQuestion && win.testEngine.currentQuestion.id === 1, "Question 1 loaded in test engine");
        
        // Execute Code Only
        await win.testEngine.runCodeOnly();
        const termOut = doc.getElementById("terminal-stdout");
        assert(termOut && termOut.textContent.length > 0, "Terminal received output for runCodeOnly");

        // Submit Answer for Question 1
        win.testEngine.setCurrentCode(win.testEngine.currentQuestion.solutionCode);
        await win.testEngine.submitAnswer();
        assert(win.store.isQuestionComplete(1), "Question 1 marked completed upon submit");
        assert(win.store.getScore() >= 1, "Score incremented to at least 1");

        // 9. Test Question 71 & 72 in Simulator
        win.navigateTo("test", 71, false);
        assert(win.testEngine.currentQuestion.id === 71, "Question 71 loaded");
        win.testEngine.setCurrentCode(win.testEngine.currentQuestion.solutionCode);
        await win.testEngine.submitAnswer();
        assert(win.store.isQuestionComplete(71), "Question 71 passes test suite");

        win.navigateTo("test", 72, false);
        assert(win.testEngine.currentQuestion.id === 72, "Question 72 loaded");
        win.testEngine.setCurrentCode(win.testEngine.currentQuestion.solutionCode);
        await win.testEngine.submitAnswer();
        assert(win.store.isQuestionComplete(72), "Question 72 passes test suite");

        // 10. Test Reset All
        win.store.resetAll();
        assert(win.store.getScore() === 0, "Score reset to 0");
        assert(!win.store.isQuestionComplete(1), "Question 1 reset to incomplete");

        // 11. Test Export & Validate Import
        const exportData = win.store.exportProgressJson();
        assert(typeof exportData === "string" && exportData.includes('"score"'), "Export produces valid JSON string");
        const valRes = win.store.validateImportData(JSON.parse(exportData));
        assert(valRes.valid, "Exported JSON passes schema validator");

        // Finished all
        log.push("ALL AUTOMATED TESTS PASSED SUCCESSFULLY!");
        document.getElementById("results").innerHTML = "<h3>SUCCESS</h3><pre>" + log.join("\n") + "</pre>";
        fetch("/report", { method: "POST", body: log.join("\n") }).catch(() => {});
      } catch (err) {
        document.getElementById("results").innerHTML = "<h3>FAILED: " + err.message + "</h3><pre>" + err.stack + "</pre>";
        fetch("/report", { method: "POST", body: "FAIL: " + err.message + "\n" + err.stack }).catch(() => {});
      }
    };
  </script>
</body>
</html>
